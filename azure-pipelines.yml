trigger:
  - main # Se dispara automáticamente al hacer push a la rama main

pool:
  vmImage: 'windows-2022'

variables:
  proyecto: '**/Portafolio.csproj'
  buildConfiguration: 'Release'
  dotnetVersion: '10.0.x'

stages:
# 1. ETAPA DE COMPILACIÓN (CI)
- stage: Build
  displayName: 'Compilación y Publicación'
  jobs:
  - job: BuildJob
    steps:
    - task: UseDotNet@2
      displayName: 'Instalar SDK de .NET'
      inputs:
        packageType: 'sdk'
        version: '$(dotnetVersion)'

    - task: DotNetCoreCLI@2
      displayName: 'Publicar aplicación .NET'
      inputs:
        command: 'publish'
        publishWebProjects: true
        projects: '$(proyecto)'
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)'
        zipAfterPublish: true

    - task: PublishBuildArtifacts@1
      displayName: 'Guardar Artefacto (drop)'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'
        publishLocation: 'Container'

# 2. ETAPA DE DESPLIEGUE (CD)
- stage: Deploy
  displayName: 'Despliegue a Azure App Service'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: DeployJob
    steps:
    - task: DownloadBuildArtifacts@0
      displayName: 'Descargar Artefacto'
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: 'drop'
        downloadPath: '$(System.ArtifactsDirectory)'

    - task: AzureWebApp@1
      displayName: 'Desplegar en Azure'
      inputs:
        azureSubscription: 'azure-connection' # Reemplaza por el nombre exacto de tu Service Connection en Azure DevOps
        appType: 'webApp'
        appName: 'PortafolioDevsNixar20261007010712'
        package: '$(System.ArtifactsDirectory)/drop/*.zip'