trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'
  containerRegistryServiceConnection: 'ghcr-connection'
  imageRepository: 'alguerajustin20/portafolio'

stages:
- stage: Build
  displayName: 'Compilación y Docker Push'
  jobs:
  - job: BuildJob
    steps:
    - task: UseDotNet@2
      displayName: 'Instalar SDK de .NET'
      inputs:
        packageType: 'sdk'
        version: '10.x'
        includePreviewVersions: true

    - task: Docker@2
      displayName: 'Login a GitHub Container Registry'
      inputs:
        command: 'login'
        containerRegistry: '$(containerRegistryServiceConnection)'

    - task: Docker@2
      displayName: 'Construir y subir imagen Docker'
      inputs:
        command: 'buildAndPush'
        repository: '$(imageRepository)'
        dockerfile: 'Dockerfile'
        buildContext: '.'
        containerRegistry: '$(containerRegistryServiceConnection)'
        tags: |
          latest

- stage: Deploy
  displayName: 'Despliegue a Azure App Service'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: DeployJob
    steps:
    - task: AzureWebAppContainer@1
      displayName: 'Desplegar contenedor en Azure App Service'
      inputs:
        azureSubscription: 'azure-connection'
        appName: 'MIportafolio'
        imageName: 'ghcr.io/$(imageRepository):latest'