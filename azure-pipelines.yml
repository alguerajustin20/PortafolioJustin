trigger:
  - main

pool:
  vmImage: 'windows-2022'

variables:
  proyecto: '**/*.csproj'
  buildConfiguration: 'Release'

stages:
# 1. ETAPA DE COMPILACIÓN (CI)
- stage: Build
  displayName: 'Compilación y Publicación'
  jobs:
  - job: BuildJob
    steps:
    - task: UseDotNet@2
      displayName: 'Instalar SDK de .NET 10'
      inputs:
        packageType: 'sdk'
        version: '10.x'
        includePreviewVersions: true # Permite descargar e instalar .NET 10

    - task: DotNetCoreCLI@2
      displayName: 'Publicar aplicación .NET'
      inputs:
        command: 'publish'
        publishWebProjects: true
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)'
        zipAfterPublish: true

    - task: PublishBuildArtifacts@1
      displayName: 'Guardar Artefacto (drop)'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'
        publishLocation: 'Container'

# 2. ETAPA DE DESPLIEGUE (CD)
- stage: Deploy
  displayName: 'Despliegue a Azure App Service'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: DeployJob
    steps:
    - task: DownloadBuildArtifacts@0
      displayName: 'Descargar Artefacto'
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: 'drop'
        downloadPath: '$(System.ArtifactsDirectory)'

    - task: AzureWebApp@1
      displayName: 'Desplegar en Azure'
      inputs:
        azureSubscription: 'azure-connection'
        appType: 'webAppLinux'
        appName: 'MIportafolio'
        package: '$(System.ArtifactsDirectory)/drop/*.zip'